name: Build DFRP frpc

on:
  push:
    tags:
      - 'dv*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., dv1.0.0)'
        required: true
        type: string

env:
  release_tag: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  build:
    name: Build frpc binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch: [amd64, arm64, arm]
        include:
          - os: ubuntu-latest
            goos: linux
          - os: windows-latest
            goos: windows
          - os: macos-latest
            goos: darwin
          # 添加 ARMv7 支持 (GOARCH=arm GOARM=7)
          - os: ubuntu-latest
            goos: linux
            arch: arm
            goarm: 7
        exclude:
          - os: windows-latest
            arch: arm64
          - os: windows-latest
            arch: arm
          - os: macos-latest
            arch: arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Get dependencies
        run: go mod tidy

      - name: Set output filename
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "arm" ]; then
            echo "OUTPUT_NAME=frpc-${{ matrix.goos }}-armv7" >> $GITHUB_ENV
          else
            echo "OUTPUT_NAME=frpc-${{ matrix.goos }}-${{ matrix.arch }}" >> $GITHUB_ENV
          fi
          if [ "${{ matrix.goos }}" = "windows" ]; then
            echo "EXT=.exe" >> $GITHUB_ENV
          else
            echo "EXT=" >> $GITHUB_ENV
          fi

      - name: Build frpc
        run: |
          if [ "${{ matrix.arch }}" = "arm" ]; then
            GOOS=${{ matrix.goos }} GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -o ./bin/${{ env.OUTPUT_NAME }}${{ env.EXT }} ./cmd/frpc/main.go
          else
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -o ./bin/${{ env.OUTPUT_NAME }}${{ env.EXT }} ./cmd/frpc/main.go
          fi
        shell: bash

      - name: Create tar.gz archive
        run: |
          cd ./bin
          tar -czf ../${{ env.OUTPUT_NAME }}.tar.gz ${{ env.OUTPUT_NAME }}${{ env.EXT }}
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}.tar.gz
          path: ./${{ env.OUTPUT_NAME }}.tar.gz

  deploy:
    name: Deploy all binaries to server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List downloaded files
        run: ls -Rl

      - name: Setup SSH and SCP
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            mkdir -p /home/${{ secrets.SSH_USERNAME }}/frp/${{ env.release_tag }}

      - name: Deploy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "./deploy/${{ env.release_tag }}/*.tar.gz"
          target: "/home/${{ secrets.SSH_USERNAME }}/frp/${{ env.release_tag }}/"
          strip_components: 2
